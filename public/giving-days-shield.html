<!-- Pre-launch teaser. giving-days-shield.js swaps this in for the page content until the campaign starts.
     {{STARTS_ISO}} = launch time, {{STARTS_LABEL}} = e.g. "Monday, November 30". Nothing about the goal, challenges,
     leaderboards or donors belongs here. -->
<style>
.sh { background: #fff; color: var(--navy); text-align: center; padding: 56px 24px 64px; border-top: 5px solid var(--trinity-yellow); }
.sh-logo { display: block; width: min(340px, 72%); height: auto; margin: 0 auto 28px; }
.sh h1 { font: 600 34px/1.2 'Lora', serif; margin: 10px 0 8px; color: var(--navy); }
.sh h1 em { color: var(--navy); font-style: italic; background: linear-gradient(transparent 62%, var(--trinity-yellow) 62%, var(--trinity-yellow) 92%, transparent 92%); padding: 0 4px; }
.sh-sub { font-size: 16px; color: var(--ink-mid); max-width: 520px; margin: 0 auto; line-height: 1.55; }
/* Countdown: an arch of 30 dots, one per day of the last 30 before launch; days already gone are yellow */
.sh-arc { width: 300px; max-width: 100%; margin: 28px auto 32px; }
.sh-arch { position: relative; }
.sh-arch svg { display: block; width: 100%; height: auto; }
.sh-mid { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; }
.sh-mid b { display: block; font: 600 64px/1 'Lora', serif; color: var(--navy); }
.sh-mid span { display: block; margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-muted); }
.sh-rest { margin-top: 10px; font: 600 17px 'Lora', serif; color: var(--navy); text-align: center; font-variant-numeric: tabular-nums; }
.sh .btn-give { width: auto; display: inline-block; padding: 16px 38px; }
.sh-note { margin-top: 14px; font-size: 13px; color: var(--ink-muted); }
@media (max-width: 560px) { .sh { padding: 40px 18px 48px; } .sh h1 { font-size: 27px; } .sh .btn-give { width: 100%; } }
</style>
<section class="sh" id="shield">
  <img class="sh-logo" src="/giving-days-logo-on-white.svg" alt="Trinity School Giving Days">
  <h1>Giving Days begin <em>{{STARTS_LABEL}}</em></h1>
  <p class="sh-sub">Join the Trinity community in supporting the Trinity Fund. You are welcome to make your gift now.</p>
  <div class="sh-arc" id="sh-arc" role="timer" aria-label="Time until Giving Days begin" hidden>
    <div class="sh-arch"><svg viewBox="0 0 300 160" aria-hidden="true" id="sh-svg"></svg><div class="sh-mid"><b id="sh-d">0</b><span>days to go</span></div></div>
    <div class="sh-rest" id="sh-rest"></div>
  </div>
  <button class="btn-give" id="hero-give" type="button">Make your gift →</button>
  <p class="sh-note">Questions? <a href="mailto:trinityfund@trinityschoolnyc.org" style="color:inherit">trinityfund@trinityschoolnyc.org</a></p>
</section>
<script>
(function () {
  var t = new Date('{{STARTS_ISO}}').getTime(), box = document.getElementById('sh-arc'), svg = document.getElementById('sh-svg'), h = '';
  for (var i = 0; i < 30; i++) {
    var a = Math.PI * (1 - i / 29);
    h += '<circle cx="' + (150 + 130 * Math.cos(a)).toFixed(1) + '" cy="' + (150 - 130 * Math.sin(a)).toFixed(1) + '" r="6" fill="#E4E2DC"/>';
  }
  svg.innerHTML = h;
  var dots = svg.querySelectorAll('circle'), z = function (n) { return (n < 10 ? '0' : '') + n; };
  function tick() {
    var ms = t - Date.now();
    if (ms <= 0) {   // launch time: the real page replaces the teaser (reload at most once per 10s, in case this device's clock runs fast)
      try { var last = +sessionStorage.getItem('gdShieldReload') || 0; if (Date.now() - last < 10000) return; sessionStorage.setItem('gdShieldReload', Date.now()); } catch (e) {}
      setTimeout(function () { location.reload(); }, 1000 + Math.random() * 2000); return;
    }
    var sec = Math.floor(ms / 1000), m = Math.floor(sec / 60), D = Math.floor(m / 1440);
    document.getElementById('sh-d').textContent = D;
    document.getElementById('sh-rest').textContent = z(Math.floor(m % 1440 / 60)) + ' : ' + z(m % 60) + ' : ' + z(sec % 60);
    var left = Math.min(30, D + 1);   // the day in progress counts as a day still to come
    for (var k = 0; k < dots.length; k++) dots[k].setAttribute('fill', k < 30 - left ? '#FCB104' : '#E4E2DC');
    box.hidden = false;
  }
  tick(); setInterval(tick, 1000);
})();
</script>
